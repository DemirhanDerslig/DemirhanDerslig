<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DemirhanDerslig - Ana Sayfa</title>
    <!-- Google Fonts ve İkonlar için FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .container {
            flex: 1;
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .lesson-btn {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 20px 25px;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .lesson-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
        }

        .lesson-btn i {
            font-size: 1.8rem;
            margin-right: 15px;
            background: rgba(255, 255, 255, 0.2);
            padding: 12px;
            border-radius: 8px;
        }

        /* İstediğin Renk Düzenleri */
        .btn-turkce { background-color: #e74c3c; /* Kırmızı */ }
        .btn-matematik { background-color: #3498db; /* Mavi */ }
        .btn-fen { background-color: #2ecc71; /* Yeşil */ }
        .btn-cpp { background-color: #9b59b6; /* Mor */ }
        .btn-csharp { background-color: #e67e22; /* Turuncu */ }
        .btn-din { background-color: #1abc9c; /* Turkuaz / Deniz Yeşili */ }

        footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 0.9rem;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>
        <h1>DemirhanDerslig</h1>
        <p>Eğitim ve Programlama Dersleri Platformu</p>
    </header>

    <div class="container">
        <!-- Türkçe Ders 4. Sınıf -->
        <a href="turkce_ders.html" class="lesson-btn btn-turkce">
            <i class="fa-solid fa-book-open"></i>
            Türkçe Ders 4. Sınıf
        </a>

        <!-- Matematik Ders 4. Sınıf -->
        <a href="matematikders.html" class="lesson-btn btn-matematik">
            <i class="fa-solid fa-calculator"></i>
            Matematik Ders 4. Sınıf
        </a>

        <!-- Fen Bilimleri 4. Sınıf -->
        <a href="fenbilimleriders.html" class="lesson-btn btn-fen">
            <i class="fa-solid fa-atom"></i>
            Fen Bilimleri 4. Sınıf
        </a>

        <!-- C++ Programlama Dersi 4. Sınıf -->
        <a href="cppders.html" class="lesson-btn btn-cpp">
            <i class="fa-solid fa-code"></i>
            C++ Programlama Dersi 4. Sınıf
        </a>

        <!-- CSharp Programlama 4. Sınıf -->
        <a href="csharpdersi.html" class="lesson-btn btn-csharp">
            <i class="fa-solid fa-laptop-code"></i>
            CSharp Programlama 4. Sınıf
        </a>

        <!-- Din Kültürü Dersi 4. Sınıf -->
        <a href="MEB_DinKulturu.html" class="lesson-btn btn-din">
            <i class="fa-solid fa-mosque"></i>
            Din Kültürü Dersi 4. Sınıf
        </a>
    </div>

    <footer>
        <p>&copy; 2026 DemirhanDerslig. Tüm hakları saklıdır. | GitHub Pages ile yayınlanmıştır.</p>
    </footer>

</body>
</html>
